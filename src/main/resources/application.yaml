spring:
  application:
    name: BugunAL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bugunal}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_TLS:true}
      mail.smtp.starttls.required: ${SMTP_TLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  mail-from: ${SMTP_USERNAME}
  bootstrap-email: ${ADMIN_EMAIL:}
  bootstrap-password: ${ADMIN_PASSWORD:}
  code-ttl-minutes: 10
  reset-ttl-minutes: 30
  code-max-attempts: 5
  resend-seconds: 60
  login-max-attempts: 5
  lock-minutes: 15
