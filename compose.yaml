services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bugunal
      POSTGRES_USER: bugunal
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugunal"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
